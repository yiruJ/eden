<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400;1,700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400;1,700&display=swap">
    </noscript>

    <!-- Fallback title for pre-JS paint / non-JS crawlers. Every routed page overrides
         this (and description/OG/Twitter tags) via the <SEO> component (react-helmet-async).
         Do NOT add a static <meta name="description">, og:title, og:description, og:url,
         twitter:title, twitter:description, or twitter:image here — react-helmet-async
         does not remove pre-existing static tags, it only appends its own, so a static
         duplicate here would sit ahead of the per-page one in the DOM and could get read
         by crawlers/link-unfurlers instead of the correct per-page content. -->
    <title>Eden Music Academy: Piano, Violin, Viola & Cello Lessons in Sydney</title>

    <!-- Open Graph: only tags NOT set per-page by <SEO> live here -->
    <meta property="og:site_name" content="Eden Music Academy" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:type" content="website" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Eden Music Academy logo" />

    <!-- Twitter Card: only tags NOT set per-page by <SEO> live here -->
    <meta name="twitter:card" content="summary" />

    <!-- Google Ads tag -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18033582805"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-18033582805');
    </script>

    <!-- Geo & contact -->
    <meta name="geo.region" content="AU-NSW" />
    <meta name="geo.placename" content="Strathfield" />

    <!-- LocalBusiness JSON-LD schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicSchool",
      "name": "Eden Music Academy",
      "url": "https://edenmusicacademy.com",
      "logo": "https://edenmusicacademy.com/logo.png",
      "image": "https://edenmusicacademy.com/logo.png",
      "description": "Expert piano, violin, viola, and cello lessons for all ages in Strathfield, Sydney. Sydney Conservatorium-trained teachers.",
      "telephone": "+61434144955",
      "email": "info@edenmusicacademy.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Shop 24/48 Cooper St",
        "addressLocality": "Strathfield",
        "addressRegion": "NSW",
        "postalCode": "2135",
        "addressCountry": "AU"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": -33.866120,
        "longitude": 151.091852
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "15:30",
          "closes": "20:30"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Saturday",
          "opens": "09:30",
          "closes": "17:00"
        }
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Music Lessons",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Piano Lessons" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Violin Lessons" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Viola Lessons" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Cello Lessons" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Ensemble Program" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Music Theory Classes" } }
        ]
      },
      "sameAs": [
        "https://instagram.com",
        "https://facebook.com"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
